<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Management Information</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">MI</span><span>Management Information</span></div>
  <div class="who">
    <select id="firm" aria-label="Firm" hidden></select>
    <span id="name"></span>
    <a id="password" href="#">Change password</a>
    <a id="signout" href="#">Sign out</a>
  </div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="pipeline" aria-selected="true">Quote pipeline</button>
  <button role="tab" data-tab="orderBook">Order book and cash in</button>
  <button role="tab" data-tab="hours">Hours by job</button>
  <button role="tab" data-tab="fixes">Things to fix <span id="fix-count" class="count" hidden></span></button>
</nav>
<main id="main"><p class="muted">Loading…</p></main>
<footer class="foot muted" id="foot"></footer>
<script src="/app.js"></script>
</body>
</html>
